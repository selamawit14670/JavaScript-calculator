<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>calculator</h1>
    </header>
    <section>
        <div id = "calculator">
            <div>
                <input type="text" id="result" placeholder="0" readonly>
            </div>
            
            <div id="buttons">
                <div id="number">
                <button class="number" id="a">1</button>
                <button class="number"id="b">2</button>
                <button class="number" id="c">3</button>
                <button class="number" id="d">4</button>
                <button class="number" id="e">5</button>
                <button class="number" id="f">6</button>
                <button class="number" id="g">7</button>
                <button class="number" id="h">8</button>
                <button class="number" id="i">9</button>
                <button class="number" id="j">0</button>
                <button class="delete">delete</button>
                <button class="answer">=</button>
            </div>

            <div id = "operator">
                <button type = "submit" id = "add">+</button>
                <button type = "submit" id = "subtract">-</button>
                <button type = "submit" id = "multiply">*</button>
                <button type="submit" id="divide">÷</button>
            </div>  
            </div>
            
        </div>
        
    </section>


<script src="script.js"></script>
</body>
</html>
